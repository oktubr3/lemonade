name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pwa:
    name: Lint and build PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Sin `version:` a proposito: la version sale de `packageManager` en
      # package.json, que es la unica fuente de verdad. Declararla en los dos
      # lugares hace fallar la action con "Multiple versions of pnpm specified".
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # Unit tests only. The Firestore rules suite (`test:rules`) needs the
      # emulator and Java, so it stays a local script for now.
      - name: Unit tests
        run: pnpm run test

      - name: Build (no version bump)
        run: pnpm run build:manual
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci.example.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci.example.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: ci-placeholder

  functions:
    name: Install Cloud Functions dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci
