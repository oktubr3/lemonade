<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemonade Pass Manager</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <img src="../icons/icon-32.png" alt="Lemonade" width="32" height="32">
                <span>Lemonade Password Manager</span>
            </div>
        </header>

        <!-- Login View -->
        <div id="login-view" class="view">
            <div class="login-content">
                <p class="login-text">Sign in to access your passwords</p>
                <button id="google-login-btn" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Sign in with Google
                </button>
            </div>
        </div>

        <!-- Main View -->
        <div id="main-view" class="view hidden">
            <!-- User Info -->
            <div class="user-info">
                <div class="user-avatar" id="user-avatar">U</div>
                <div class="user-details">
                    <div class="user-email" id="user-email">user@example.com</div>
                    <button id="logout-btn" class="btn-link">Sign out</button>
                </div>
            </div>

            <!-- Search and Sort -->
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search passwords..." class="search-input">
                <div class="sort-controls">
                    <button id="sort-btn" class="sort-btn" title="Ordenar">
                        <span id="sort-label">A-Z</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 9l6 6 6-6"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Credentials List -->
            <div id="credentials-list" class="credentials-list">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <a href="https://app.lemonadepass.app" target="_blank" class="btn-link">
                    Open Lemonade App
                </a>
            </div>
        </div>

        <!-- Error View -->
        <div id="error-view" class="view hidden">
            <div class="error-content">
                <div class="error-icon">⚠️</div>
                <p class="error-text" id="error-text">An error occurred</p>
                <button id="retry-btn" class="btn btn-secondary">Try again</button>
            </div>
        </div>
    </div>

    <script src="popup.js" type="module"></script>
</body>
</html>
